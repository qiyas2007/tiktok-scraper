name: TikTok Scraper Bot

on:
  schedule:
    - cron: '0 * * * *' # Hər saatın əvvəlində işləyəcək (məsələn: 14:00, 15:00)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-22.04

    steps:
    - name: Repozitoriyanı kopyala
      uses: actions/checkout@v4

    - name: Yaddaşı bərpa et (Təkrarları silmək üçün)
      uses: actions/cache@v4
      with:
        path: seen_videos.txt
        key: seen-videos-${{ github.run_id }}
        restore-keys: |
          seen-videos-

    - name: Python quraşdır
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Kitabxanaları yüklə
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: Botu işə sal
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        PROXY_URL: ${{ secrets.PROXY_URL }}
      run: python bot.py
